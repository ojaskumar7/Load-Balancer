listen:
  host: "0.0.0.0"
  port: 8080

max_cap: 2

health_check:
  interval_seconds: 5
  timeout_seconds: 2
  failure_threshold: 2

connect_timeout_seconds: 3
max_retries: 2
shutdown_grace_seconds: 10

backends:
  - host: "127.0.0.1"
    port: 43001
  - host: "127.0.0.1"
    port: 43002
  - host: "127.0.0.1"
    port: 43003
